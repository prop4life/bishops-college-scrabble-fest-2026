<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results</title><link rel="stylesheet" href="styles.css"></head><body><header class="hero"><div class="brand"><div class="since">SINCE<br><b>1875</b></div><div class="college">Bishop's College</div></div><div class="scrabble">SCRABBLE<br><span>FEST</span></div></header><main class="wrap"><div class="toolbar"><a href="index.html">Home</a><a id="profiles" href="#">Player Profiles</a></div><h1 id="eventTitle"></h1><p class="sub">05 September 2026 · 6 Rounds</p><div id="rounds" class="rounds"></div></main><script src="app.js"></script><script>async function page(){const ev=cfg();document.querySelector('#eventTitle').textContent=ev.name;document.querySelector('#profiles').href=`players.html?event=${qs('event')}`;let out='';for(let r=1;r<=ev.rounds;r++){let p=await published(ev,r,'pairings'),s=await published(ev,r,'standings');out+=`<section class="round"><h3>Round ${r}</h3><div class="status"><a class="${p?'live':''}" href="${p?`viewer.html?event=${qs('event')}&round=${r}&type=pairings`:'#'}">${p?'View Pairings':'Pairings — Not Published'}</a><a class="${s?'live':''}" href="${s?`viewer.html?event=${qs('event')}&round=${r}&type=standings`:'#'}">${s?'View Standings':'Standings — Not Published'}</a></div></section>`}document.querySelector('#rounds').innerHTML=out}page()</script></body></html>
