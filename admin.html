<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Centre</title><link rel="stylesheet" href="style.css"></head><body><div class="shell admin"><img class="banner" src="assets/bishops-college.jpeg"><h1>Results Update Centre</h1><p class="date">Bishop's College Scrabble Fest - 2026 · 05 September 2026</p><div class=box><label>GitHub Token</label><input id=token type=password placeholder="Fine-grained token: Contents Read and write"><p>Token is stored only in this browser.</p><label>Category</label><select id=event><option value=u12>Under 12 — 6 rounds</option><option value=u15>Under 15 — 6 rounds</option><option value=u20>Under 20 — 6 rounds</option></select><label>Round</label><select id=round></select><label>File type</label><select id=kind><option value=pairings>Pairings</option><option value=standings>Standings</option></select><label>HTML file</label><input id=file type=file accept=".html,text/html"><button id=publish class=btn style="width:100%;border:0;margin-top:14px;cursor:pointer">Publish</button><div id=msg class=msg></div></div></div><script src="admin.js"></script></body></html>
