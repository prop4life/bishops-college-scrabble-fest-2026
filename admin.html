<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Centre</title><link rel="stylesheet" href="styles.css"></head><body><header class="hero"><div class="brand"><div class="since">SINCE<br><b>1875</b></div><div class="college">Bishop's College</div></div><div class="scrabble">SCRABBLE<br><span>FEST</span></div></header><main class="wrap"><h1>Private Tournament Update Centre</h1><p class="sub">Upload Pairings first. Upload Standings later. Corrected standings may be overwritten.</p><div class="panel"><div class="grid2"><label>Category<select id="event"><option value="u12">Under 12</option><option value="u15">Under 15</option><option value="u20">Under 20</option></select></label><label>Round<select id="round"></select></label></div><p><label>GitHub access token<br><input id="token" type="password" style="width:100%;padding:10px" placeholder="Fine-grained token: Contents Read and write"></label></p><div class="toolbar"><button class="btn" id="pairBtn">Upload Pairings</button><button class="btn" id="standBtn">Upload Standings</button></div><input id="file" type="file" accept=".html,.htm" hidden><div id="msg" class="panel muted">Ready.</div></div><div class="panel"><b>Safety:</b> the token is stored only in this browser. It is never written into the repository.</div></main><script src="app.js"></script><script>const repo='prop4life/bishops-college-scrabble-fest-2026';const E=document.querySelector('#event'),R=document.querySelector('#round'),F=document.querySelector('#file'),M=document.querySelector('#msg'),T=document.querySelector('#token');T.value=localStorage.getItem('bc_token')||'';for(let i=1;i<=6;i++)R.add(new Option('Round '+i,i));function say(x,c=''){M.className='panel '+c;M.textContent=x}async function upload(type){const token=T.value.trim();if(!token)return say('Enter your GitHub token first.','danger');localStorage.setItem('bc_token',token);F.value='';F.onchange=async()=>{const f=F.files[0];if(!f)return;try{const text=await f.text();if(type==='standings'){const rows=parseStandings(text);const games=rows.filter(x=>x.roundResult&&x.oppId);if(!games.length)throw Error('The TSH standings contains 0 recognizable game records. Check that you selected the standings HTML.');}const ev=CFG[E.value],path=`${ev.folder}/round-${String(R.value).padStart(2,'0')}-${type}.html`;const base='https://api.github.com/repos/'+repo+'/contents/'+path;const headers={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'};let old=await fetch(base,{headers});let sha=null;if(old.ok)sha=(await old.json()).sha;let bin=btoa(unescape(encodeURIComponent(text)));let body={message:`Publish ${ev.name} Round ${R.value} ${type}`,content:bin};if(sha)body.sha=sha;let res=await fetch(base,{method:'PUT',headers,body:JSON.stringify(body)});if(!res.ok){let j=await res.json().catch(()=>({}));throw Error(j.message||'GitHub upload failed');}say(`Published successfully: ${ev.name} Round ${R.value} ${type}.`,'success')}catch(e){say('Publishing failed: '+e.message,'danger')}};F.click()}document.querySelector('#pairBtn').onclick=()=>upload('pairings');document.querySelector('#standBtn').onclick=()=>upload('standings');</script></body></html>
