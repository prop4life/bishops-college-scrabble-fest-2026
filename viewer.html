<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>View Results</title><link rel="stylesheet" href="styles.css?v=20260905"><style>.pairing-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.match{border:1px solid #e1d5e4;border-radius:12px;background:#fff;overflow:hidden}.match-head{display:grid;grid-template-columns:70px 1fr 70px 1fr;background:#551064;color:#fff;font-weight:700;font-size:13px}.match-head div{padding:9px 8px}.match-body{display:grid;grid-template-columns:70px 1fr 70px 1fr;align-items:center}.match-body>div{padding:11px 8px;border-bottom:1px solid #eadfea}.match-body>div:nth-child(4n+1),.match-body>div:nth-child(4n+3){text-align:center;font-weight:700}.match-body .name{font-weight:700}.match-body .id{display:block;font-size:12px;color:#765d7c;font-weight:400;margin-top:2px}.match-body .bye{grid-column:1/-1;text-align:center;font-weight:700;padding:15px}.pairing-note{margin:0 0 14px;color:#765d7c;font-size:14px}.result-frame{width:100%;border:0}@media(max-width:700px){.pairing-grid{grid-template-columns:1fr;gap:10px}.match-head{font-size:12px;grid-template-columns:58px 1fr 58px 1fr}.match-body{grid-template-columns:58px 1fr 58px 1fr}.match-body>div{padding:10px 7px;font-size:14px}.match-body .id{font-size:11px}.pairing-note{font-size:13px}}</style></head><body><header class="hero"><div class="brand"><div class="since">SINCE<br><b>1875</b></div><div class="college">Bishop's College</div></div><div class="scrabble">SCRABBLE<br><span>FEST</span></div></header><main class="wrap viewer-wrap"><div class="toolbar"><a id="back" href="#">← Back to Results</a></div><div class="result-head"><div><div class="eyebrow" id="category"></div><h1 id="title">Results</h1></div><div class="round-badge" id="roundBadge"></div></div><div id="view" class="panel result-panel">Loading…</div></main><script src="app.js?v=20260905"></script><script>function cleanName(el){const n=el.querySelector('.name');const id=el.querySelector('.id');return{name:n?n.textContent.trim():el.textContent.trim().replace(/\s*\([^)]*\)\s*/,' ').trim(),id:id?id.textContent.trim():''}}function makeMatch(cells){if(cells.length<6)return '';const a=cleanName(cells[1]),ao=cleanName(cells[2]),b=cleanName(cells[4]),bo=cleanName(cells[5]);const boardA=cells[0].textContent.trim(),boardB=cells[3].textContent.trim();if(bo.toLowerCase()==='bye'||cells[5].querySelector('.bye'))return `<article class="match"><div class="match-head"><div>Board</div><div>Player</div><div></div><div>Opponent</div></div><div class="match-body"><div>${esc(boardA)}</div><div class="name">${esc(a.name)}<span class="id">${esc(a.id)}</span></div><div></div><div class="bye">BYE</div></div></article>`;return `<article class="match"><div class="match-head"><div>Board</div><div>Player</div><div>Board</div><div>Opponent</div></div><div class="match-body"><div>${esc(boardA)}</div><div class="name">${esc(a.name)}<span class="id">${esc(a.id)}</span></div><div>${esc(boardB)}</div><div class="name">${esc(ao.name)}<span class="id">${esc(ao.id)}</span></div></div><div class="match-body"><div></div><div class="name">${esc(b.name)}<span class="id">${esc(b.id)}</span></div><div></div><div class="name">${esc(bo.name)}<span class="id">${esc(bo.id)}</span></div></div></article>`}async function go(){const ev=cfg(),r=qs('round'),type=qs('type'),url=`${ev.folder}/round-${String(r).padStart(2,'0')}-${type}.html`;document.querySelector('#back').href=(qs('event')||'u12')+'.html';document.querySelector('#category').textContent=ev.name;document.querySelector('#title').textContent=type==='pairings'?'Round Pairings':'Round Standings';document.querySelector('#roundBadge').textContent='Round '+r;try{const html=await getText(url);if(type==='pairings'){const doc=new DOMParser().parseFromString(html,'text/html');const tables=[...doc.querySelectorAll('table')];let matches=[];for(const t of tables){for(const tr of [...t.querySelectorAll('tr')]){const cells=[...tr.children];if(cells.length===6&&cells[1].querySelector('.name')&&cells[2].querySelector('.name'))matches.push(makeMatch(cells))}}if(!matches.length)throw Error('No pairing rows found');document.querySelector('#view').innerHTML='<p class="pairing-note">Round '+esc(r)+' pairings · '+matches.length+' boards</p><div class="pairing-grid">'+matches.join('')+'</div>'}else{const doc=new DOMParser().parseFromString(html,'text/html');let table=doc.querySelector('table');if(!table)throw Error('No standings table found');let rows=[...table.querySelectorAll('tr')];let head=[...rows[0].children].map(x=>x.textContent.trim());let h='<div class="tablewrap"><table><tr>'+head.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>';for(const tr of rows.slice(1)){let cells=[...tr.children];let pi=cells.findIndex(x=>/(?:#|A)\\s*\\d+/i.test(x.textContent));if(pi<0)pi=0;let p=parsePlayerCell(cells[pi]);h+='<tr>'+cells.map((c,i)=>{if(i===pi&&p.id)return `<td><a class="player" href="player.html?event=${qs('event')}&id=${p.id}">${esc(p.name||c.textContent)}</a></td>`;return `<td>${esc(c.textContent.trim())}</td>`}).join('')+'</tr>'}h+='</table></div>';document.querySelector('#view').innerHTML=h}}catch(e){console.error(e);document.querySelector('#view').innerHTML='<p class="danger">This result has not been published yet.</p>'}}go()</script></body></html>
