<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>View Results</title><link rel="stylesheet" href="styles.css"></head><body><header class="hero"><div class="brand"><div class="since">SINCE<br><b>1875</b></div><div class="college">Bishop's College</div></div><div class="scrabble">SCRABBLE<br><span>FEST</span></div></header><main class="wrap"><div class="toolbar"><a id="back" href="#">Back</a></div><h1 id="title">Results</h1><div id="view" class="panel">Loading…</div></main><script src="app.js"></script><script>async function go(){const ev=cfg(),r=qs('round'),type=qs('type'),url=`${ev.folder}/round-${String(r).padStart(2,'0')}-${type}.html`;document.querySelector('#back').href=(qs('event')||'u12')+'.html';try{const html=await getText(url);if(type==='pairings'){const box=document.querySelector('#view');box.innerHTML='';const f=document.createElement('iframe');f.style.cssText='width:100%;min-height:900px;border:0';f.srcdoc=html;box.appendChild(f)}else{const doc=new DOMParser().parseFromString(html,'text/html');let table=doc.querySelector('table');if(!table)throw Error('No standings table found');let rows=[...table.querySelectorAll('tr')];let head=[...rows[0].children].map(x=>x.textContent.trim());let h='<div class="tablewrap"><table><tr>'+head.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>';for(const tr of rows.slice(1)){let cells=[...tr.children];let pi=cells.findIndex(x=>/(?:#|A)\s*\d+/i.test(x.textContent));if(pi<0)pi=0;let p=parsePlayerCell(cells[pi]);h+='<tr>'+cells.map((c,i)=>{if(i===pi&&p.id)return `<td><a class="player" href="player.html?event=${qs('event')}&id=${p.id}">${esc(p.name||c.textContent)}</a></td>`;return `<td>${esc(c.textContent.trim())}</td>`}).join('')+'</tr>'}h+='</table></div>';document.querySelector('#view').innerHTML=h}}catch(e){document.querySelector('#view').innerHTML='<p class="danger">This result has not been published yet.</p>'}}go()</script></body></html>
