<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>View Results</title><link rel="stylesheet" href="styles.css?v=20260905c"><style>.pairing-list{display:grid;gap:9px}.pair-line{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;background:#fff;border:1px solid #e1d5e4;border-radius:11px;overflow:hidden}.board{height:100%;display:flex;align-items:center;justify-content:center;background:#551064;color:#fff;font-weight:800;padding:12px 8px}.pair-text{padding:12px 14px;font-size:16px;font-weight:650;line-height:1.45}.starts{font-style:italic;font-weight:800;color:#7a238b}.repeat{font-weight:800;color:#a34b00}.vs{font-weight:800;margin:0 5px}.bye{font-weight:800;color:#551064}.pairing-note{margin:0 0 14px;color:#765d7c;font-size:14px}.error-box{padding:16px;border-radius:10px;background:#fff1f1;border:1px solid #e4bcbc;color:#8b1e1e}@media(max-width:700px){.pair-line{grid-template-columns:54px minmax(0,1fr)}.board{padding:10px 5px;font-size:13px}.pair-text{padding:11px 9px;font-size:14px;overflow-wrap:anywhere}.vs{margin:0 3px}}@media(max-width:390px){.pair-text{font-size:13px}.pair-line{grid-template-columns:48px minmax(0,1fr)}}</style></head><body><header class="hero"><div class="brand"><div class="since">SINCE<br><b>1875</b></div><div class="college">Bishop's College</div></div><div class="scrabble">SCRABBLE<br><span>FEST</span></div></header><main class="wrap viewer-wrap"><div class="toolbar"><a id="back" href="#">← Back to Results</a></div><div class="result-head"><div><div class="eyebrow" id="category"></div><h1 id="title">Results</h1></div><div class="round-badge" id="roundBadge"></div></div><div id="view" class="panel result-panel">Loading…</div></main><script src="app.js?v=20260905c"></script><script>function esc2(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function line(board,text){return `<div class="pair-line"><div class="board">${board?esc2(board):'—'}</div><div class="pair-text">${text}</div></div>`}function rankedPairings(doc){const out=[];for(const tr of doc.querySelectorAll('table.pairings tr')){const cells=[...tr.children];if(cells.length!==2||cells[0].tagName==='TH')continue;const board=cells[0].textContent.trim(),cell=cells[1],text=cell.textContent.replace(/\s+/g,' ').trim();if(cell.querySelector('.bye')||/\bbye\b/i.test(text)){const m=text.match(/^(.+?)\s*\(([A-Za-z]?\d+)\)/);out.push(line(board,`${esc2(m?m[1].trim():text.replace(/:\s*bye.*$/i,'').trim())} (${esc2(m?m[2]:'')}) <span class="bye">BYE</span>`));continue}const m=text.match(/^(.+?)\s*\(([A-Za-z]?\d+)\)\s*(\*[^*]+\*)?\s+vs\.\s+(.+?)\s*\(([A-Za-z]?\d+)\)(?:\s+(repeat))?/i);if(m){const marker=m[3]?`<span class="starts">${esc2(m[3])}</span> `:'';const repeat=m[6]?` <span class="repeat">repeat</span>`:'';out.push(line(board,`${esc2(m[1].trim())} (${esc2(m[2])}) ${marker}<span class="vs">vs.</span> ${esc2(m[4].trim())} (${esc2(m[5])})${repeat}`))}}return out}function alphaPairings(doc){const out=[];for(const tr of doc.querySelectorAll('table.alpha_pairings tr')){const c=[...tr.children];if(c.length!==6||c.some(x=>x.tagName==='TH'))continue;const txt=i=>c[i].textContent.replace(/\s+/g,' ').trim();out.push(line(txt(0),`${esc2(txt(1))} <span class="vs">vs.</span> ${esc2(txt(2))}`));if(txt(3)||txt(4)||txt(5))out.push(line(txt(3),`${esc2(txt(4))} <span class="vs">vs.</span> ${esc2(txt(5))}`))}return out}function resultUrl(ev,r,type){return new URL(`${ev.folder}/round-${String(r).padStart(2,'0')}-${type}.html`,new URL('./',location.href)).href}async function loadResult(ev,r,type){const u=resultUrl(ev,r,type),x=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!x.ok)throw Error('HTTP '+x.status);return await x.text()}async function go(){const ev=cfg(),r=qs('round'),type=qs('type');document.querySelector('#back').href=(qs('event')||eventKey())+'.html';document.querySelector('#category').textContent=ev.name;document.querySelector('#title').textContent=type==='pairings'?'Round Pairings':'Round Standings';document.querySelector('#roundBadge').textContent='Round '+r;try{const html=await loadResult(ev,r,type),doc=new DOMParser().parseFromString(html,'text/html');if(type==='pairings'){let matches=rankedPairings(doc);if(!matches.length)matches=alphaPairings(doc);if(!matches.length)throw Error('No recognised pairing rows');document.querySelector('#view').innerHTML='<p class="pairing-note">Round '+esc2(r)+' pairings · '+matches.length+' boards</p><div class="pairing-list">'+matches.join('')+'</div>'}else{const table=[...doc.querySelectorAll('table')].find(t=>t.rows.length>1);if(!table)throw Error('No standings table');const rows=[...table.rows];let h='<div class="tablewrap"><table><tr>'+[...rows[0].children].map(c=>`<th>${esc2(c.textContent.trim())}</th>`).join('')+'</tr>';for(const tr of rows.slice(1))h+='<tr>'+[...tr.children].map(c=>`<td>${esc2(c.textContent.trim())}</td>`).join('')+'</tr>';h+='</table></div>';document.querySelector('#view').innerHTML=h}}catch(e){document.querySelector('#view').innerHTML=`<div class="error-box"><b>Unable to load this result.</b><br>${esc2(e.message)}</div>`}}go()</script></body></html>
