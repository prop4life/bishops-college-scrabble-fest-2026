<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>View Results</title><link rel="stylesheet" href="styles.css?v=20260905"><style>.pairing-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.match{border:1px solid #e1d5e4;border-radius:12px;background:#fff;overflow:hidden}.match-head{display:grid;grid-template-columns:70px 1fr;background:#551064;color:#fff;font-weight:700;font-size:13px}.match-head div{padding:9px 8px}.match-body{display:grid;grid-template-columns:70px 1fr;align-items:center}.match-body>div{padding:11px 8px;border-bottom:1px solid #eadfea}.match-body .name{font-weight:700}.match-body .id{display:block;font-size:12px;color:#765d7c;font-weight:400;margin-top:2px}.bye{font-weight:700;margin-top:7px}.pairing-note{margin:0 0 14px;color:#765d7c;font-size:14px}.error-box{padding:16px;border-radius:10px;background:#fff1f1;border:1px solid #e4bcbc;color:#8b1e1e}@media(max-width:700px){.pairing-grid{grid-template-columns:1fr;gap:10px}}</style></head><body><header class="hero"><div class="brand"><div class="since">SINCE<br><b>1875</b></div><div class="college">Bishop's College</div></div><div class="scrabble">SCRABBLE<br><span>FEST</span></div></header><main class="wrap viewer-wrap"><div class="toolbar"><a id="back" href="#">← Back to Results</a></div><div class="result-head"><div><div class="eyebrow" id="category"></div><h1 id="title">Results</h1></div><div class="round-badge" id="roundBadge"></div></div><div id="view" class="panel result-panel">Loading…</div></main><script src="app.js?v=20260905"></script><script>function esc2(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rankedPairings(doc){const out=[];for(const tr of doc.querySelectorAll('table.pairings tr')){const cells=[...tr.children];if(cells.length!==2||cells[0].tagName==='TH')continue;const board=cells[0].textContent.trim();const cell=cells[1];const text=cell.textContent.replace(/\s+/g,' ').trim();const bye=cell.querySelector('.bye')||/\bbye\b/i.test(text);if(bye){const m=text.match(/^(.+?)\s*\(([A-Za-z]?\d+)\)/);const name=m?m[1].trim():text.replace(/:\s*bye.*$/i,'').trim();const id=m?m[2]:'';out.push(`<article class="match"><div class="match-head"><div>Board</div><div>Player</div></div><div class="match-body"><div>${esc2(board)}</div><div class="name">${esc2(name)}<span class="id">${esc2(id)}</span><div class="bye">BYE</div></div></div></article>`);continue}const m=text.match(/^(.+?)\s*\(([A-Za-z]?\d+)\)\s*(?:\*first\*)?\s+vs\.\s+(.+?)\s*\(([A-Za-z]?\d+)\)/i);if(m)out.push(`<article class="match"><div class="match-head"><div>Board ${esc2(board)}</div><div>Pairing</div></div><div class="match-body"><div> </div><div class="name">${esc2(m[1].trim())}<span class="id">${esc2(m[2])}</span><div style="margin:6px 0;font-weight:400">vs.</div>${esc2(m[3].trim())}<span class="id">${esc2(m[4])}</span></div></div></article>`)}return out}function alphaPairings(doc){const out=[];for(const tr of doc.querySelectorAll('table.alpha_pairings tr')){const c=[...tr.children];if(c.length!==6||c.some(x=>x.tagName==='TH'))continue;const val=i=>{const n=c[i].querySelector('.name'),id=c[i].querySelector('.id');return {name:n?n.textContent.trim():c[i].textContent.trim(),id:id?id.textContent.trim():''}};const a=val(1),ao=val(2);out.push(`<article class="match"><div class="match-head"><div>Board ${esc2(c[0].textContent.trim())}</div><div>Pairing</div></div><div class="match-body"><div> </div><div class="name">${esc2(a.name)}<span class="id">${esc2(a.id)}</span><div style="margin:6px 0;font-weight:400">vs.</div>${esc2(ao.name)}<span class="id">${esc2(ao.id)}</span></div></div></article>`)}return out}function resultUrl(ev,r,type){return new URL(`${ev.folder}/round-${String(r).padStart(2,'0')}-${type}.html`,new URL('./',location.href)).href}async function loadResult(ev,r,type){const u=resultUrl(ev,r,type);const x=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!x.ok)throw Error('HTTP '+x.status);return await x.text()}async function go(){const ev=cfg(),r=qs('round'),type=qs('type');document.querySelector('#back').href=(qs('event')||'u12')+'.html';document.querySelector('#category').textContent=ev.name;document.querySelector('#title').textContent=type==='pairings'?'Round Pairings':'Round Standings';document.querySelector('#roundBadge').textContent='Round '+r;try{const html=await loadResult(ev,r,type),doc=new DOMParser().parseFromString(html,'text/html');if(type==='pairings'){let matches=rankedPairings(doc);if(!matches.length)matches=alphaPairings(doc);if(!matches.length)throw Error('No recognised pairing rows');document.querySelector('#view').innerHTML='<p class="pairing-note">Round '+esc2(r)+' pairings · '+matches.length+' boards</p><div class="pairing-grid">'+matches.join('')+'</div>'}else{const table=[...doc.querySelectorAll('table')].find(t=>t.rows.length>1);if(!table)throw Error('No standings table');const rows=[...table.rows];let h='<div class="tablewrap"><table><tr>'+[...rows[0].children].map(c=>`<th>${esc2(c.textContent.trim())}</th>`).join('')+'</tr>';for(const tr of rows.slice(1))h+='<tr>'+[...tr.children].map(c=>`<td>${esc2(c.textContent.trim())}</td>`).join('')+'</tr>';h+='</table></div>';document.querySelector('#view').innerHTML=h}}catch(e){console.error(e);document.querySelector('#view').innerHTML=`<div class="error-box"><b>Unable to load this result.</b><br>${esc2(e.message)}</div>`}}go()</script></body></html>
