<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>View Results</title><link rel="stylesheet" href="styles.css?v=20260903"></head><body><header class="hero"><div class="brand"><div class="since">SINCE<br><b>1875</b></div><div class="college">Bishop's College</div></div><div class="scrabble">SCRABBLE<br><span>FEST</span></div></header><main class="wrap viewer-wrap"><div class="toolbar"><a id="back" href="#">← Back to Results</a></div><div class="result-head"><div><div class="eyebrow" id="category"></div><h1 id="title">Results</h1></div><div class="round-badge" id="roundBadge"></div></div><div id="view" class="panel result-panel">Loading…</div></main><script src="app.js?v=20260903"></script><script>async function go(){const ev=cfg(),r=qs('round'),type=qs('type'),url=`${ev.folder}/round-${String(r).padStart(2,'0')}-${type}.html`;document.querySelector('#back').href=(qs('event')||'u12')+'.html';document.querySelector('#category').textContent=ev.name;document.querySelector('#title').textContent=type==='pairings'?'Round Pairings':'Round Standings';document.querySelector('#roundBadge').textContent='Round '+r;try{const html=await getText(url);if(type==='pairings'){const box=document.querySelector('#view');box.className='panel result-panel pairings-panel';box.innerHTML='';const f=document.createElement('iframe');f.className='result-frame';f.setAttribute('title','Round '+r+' pairings');const extra=`<style>html,body{margin:0;padding:0;background:#fff;font-family:Arial,sans-serif;color:#28132f}body{padding:18px}.container,.content,.main,.page{max-width:1400px;margin:0 auto}table{width:100%;border-collapse:separate;border-spacing:0;margin:0 auto;font-size:17px;line-height:1.45}th{background:#551064!important;color:#fff!important;padding:14px 13px!important;text-align:left;font-size:16px}td{padding:13px!important;border-bottom:1px solid #eadfea!important;font-size:17px}tr:nth-child(even) td{background:#fbf9fc!important}a{color:#551064}h1,h2,h3{color:#551064}@media(max-width:700px){body{padding:6px}table{font-size:13px}th,td{padding:9px 7px!important;font-size:13px;white-space:nowrap}.container,.content,.main,.page{width:100%;overflow-x:auto}}</style>`;f.srcdoc=html.replace('</head>',extra+'</head>');box.appendChild(f);const resize=()=>{try{const h=Math.max(850,f.contentDocument.documentElement.scrollHeight+40,f.contentDocument.body.scrollHeight+40);f.style.height=h+'px'}catch(e){f.style.height='1100px'}};f.addEventListener('load',resize);setTimeout(resize,300);setTimeout(resize,1000)}else{const doc=new DOMParser().parseFromString(html,'text/html');let table=doc.querySelector('table');if(!table)throw Error('No standings table found');let rows=[...table.querySelectorAll('tr')];let head=[...rows[0].children].map(x=>x.textContent.trim());let h='<div class="tablewrap"><table><tr>'+head.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>';for(const tr of rows.slice(1)){let cells=[...tr.children];let pi=cells.findIndex(x=>/(?:#|A)\\s*\\d+/i.test(x.textContent));if(pi<0)pi=0;let p=parsePlayerCell(cells[pi]);h+='<tr>'+cells.map((c,i)=>{if(i===pi&&p.id)return `<td><a class="player" href="player.html?event=${qs('event')}&id=${p.id}">${esc(p.name||c.textContent)}</a></td>`;return `<td>${esc(c.textContent.trim())}</td>`}).join('')+'</tr>'}h+='</table></div>';document.querySelector('#view').innerHTML=h}}catch(e){document.querySelector('#view').innerHTML='<p class="danger">This result has not been published yet.</p>'}}go()</script></body></html>
